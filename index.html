<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f6ea" />
    <meta name="description" content="Uma proposta de universo digital para Cecilia Vetchi. Jornalismo, cerâmica e projetos sobre mulheres e autonomia." />
    <title>Cecilia Vetchi — storytelling e direção criativa</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <!-- Static field declaration lets Netlify detect this React form during deployment. -->
    <form name="contato" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contato" />
      <input name="bot-field" />
      <input name="name" />
      <input type="email" name="email" />
      <input type="tel" name="whatsapp" />
      <textarea name="message"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
